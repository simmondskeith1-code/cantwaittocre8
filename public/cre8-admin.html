<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Cre8 Quotes Admin | Live Above</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500&family=Poppins:wght@400;500;600&display=swap">
<style>
  :root { --bg:#0d0d0d; --surface:#171616; --surface-2:#1f1d1d; --line:#2c2828; --fg:#f4f1f1; --dim:#a69e9e; --red:#db0101; --hot:#ff3d7f; --gold:#e8c56a; --ok:#22c55e; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 'Poppins', Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 900px; margin: 0 auto; padding: 22px 16px 60px; }
  .eyebrow { color: var(--hot); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; font-weight: 600; }
  h1 { font-family: 'Teko', sans-serif; font-weight: 500; text-transform: uppercase; font-size: 46px; margin: 4px 0 0; line-height: 1; }
  .dim { color: var(--dim); font-size: 13px; }
  input, select, textarea { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; }
  textarea { width: 100%; min-height: 70px; resize: vertical; }
  button { background: var(--red); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .row input { flex: 1 1 200px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--dim); }
  .stat b { display: block; font-family: 'Teko', sans-serif; font-size: 34px; font-weight: 500; line-height: 1; color: var(--fg); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 18px; }
  .chip { background: var(--surface); border: 1px solid var(--line); color: var(--dim); border-radius: 99px; padding: 7px 14px; font-size: 13.5px; cursor: pointer; }
  .chip.on { background: var(--hot); border-color: var(--hot); color: #fff; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 10px; }
  .top { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
  .name { font-weight: 600; font-size: 17px; }
  .pill { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 4px 9px; border-radius: 99px; background: var(--surface-2); color: var(--dim); }
  .pill.new { background: rgba(255,61,127,.18); color: #ff7aa6; }
  .pill.rush { background: rgba(219,1,1,.2); color: #ff6b6b; }
  .contact { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; font-size: 14px; }
  .contact a { color: var(--fg); }
  .idea { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 14.5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px 14px; margin-top: 10px; font-size: 14px; }
  .grid span { display: block; font-size: 11.5px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 12px; }
  .file { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; aspect-ratio: 1; overflow: hidden; position: relative; cursor: pointer; display: grid; place-items: center; font-size: 26px; }
  .file img { width: 100%; height: 100%; object-fit: cover; }
  .file small { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.75); font-size: 10.5px; padding: 3px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .edit { display: grid; grid-template-columns: 180px 1fr; gap: 8px; margin-top: 12px; }
  @media (max-width: 560px) { .edit { grid-template-columns: 1fr; } }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .actions button { padding: 8px 12px; font-size: 13.5px; }
  .clear { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: 14px; }
  .clear button { background: var(--hot); }
  .empty { color: var(--dim); text-align: center; padding: 30px 0; }
  #msg { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--hot); padding: 9px 18px; border-radius: 99px; display: none; z-index: 9; }
</style>
</head>
<body>
<script>(function(){var f;try{f=window.self!==window.top;}catch(e){f=true;}
if(f){document.documentElement.className+=' la-embed';}
else if(!/[?&]standalone=1/.test(location.search)){location.replace(/^hq\./.test(location.hostname)?'/admin':'/admin.html#cre8');}})();</script>
<style>.la-embed main{padding-top:6px}.la-embed .eyebrow:first-child,.la-embed h1{display:none}</style>
<main>
  <div class="eyebrow">Can't Wait to Cre8</div>
  <h1>Quote Requests</h1>
  <p class="dim">Every request from the Cre8 website, with the customer's files. Newest first.</p>
  <div class="row" id="login"><input type="password" id="key" placeholder="Admin key" autocomplete="current-password"><button id="go">Open</button></div>
  <div id="app" hidden>
    <div class="stats" id="stats"></div>
    <div class="clear" id="clearBox"></div>
    <div class="filters" id="filters"></div>
    <div class="row"><input type="text" id="q" placeholder="Search name, email, business"><button class="ghost" id="refresh">Refresh</button></div>
    <div id="list"></div>
    <h1 style="font-size:36px;margin-top:40px">Contact Messages</h1>
    <p class="dim">From the Contact page on the website. Each one was also emailed to you.</p>
    <div id="msgs"></div>
  </div>
</main>
<div id="msg"></div>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var KEY = '', DATA = null, FILTER = 'open', urls = {};
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function flash(t) { var m = $('#msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(flash.t); flash.t = setTimeout(function () { m.style.display = 'none'; }, 2200); }
  function api(path, opt) {
    opt = opt || {}; opt.headers = Object.assign({ 'x-admin-key': KEY }, opt.headers || {});
    return fetch(path, opt).then(function (r) { if (r.status === 401) throw new Error('Wrong admin key'); if (!r.ok) throw new Error('Request failed'); return r; });
  }
  var LABEL = { youth_s: 'YS', youth_m: 'YM', youth_l: 'YL', s: 'S', m: 'M', l: 'L', xl: 'XL', '2xl': '2XL', '3xl': '3XL', '4xl_plus': '4XL+' };
  function bizDaysUntil(d) {
    var t = new Date(); t.setHours(0, 0, 0, 0); var e = new Date(d + 'T00:00:00'), n = 0;
    while (t < e) { t.setDate(t.getDate() + 1); if (t.getDay() !== 0 && t.getDay() !== 6) n++; }
    return n;
  }
  function field(k, v) { return v ? '<div><span>' + esc(k) + '</span>' + esc(v) + '</div>' : ''; }
  function card(q) {
    var d = q.details || {}, need = q.need_by ? String(q.need_by).slice(0, 10) : '';
    var rush = need && q.status !== 'done' && q.status !== 'lost' && bizDaysUntil(need) < 4;
    var sizes = Object.keys(d.sizes || {}).map(function (k) { return LABEL[k] + ' ' + d.sizes[k]; }).join(', ');
    var garment = d.garment === 'Other' ? (d.garment_other || 'Other') : d.garment;
    var opts = DATA.statuses.map(function (s) { return '<option' + (s === q.status ? ' selected' : '') + '>' + s + '</option>'; }).join('');
    var files = (q.files || []).map(function (f) {
      return '<div class="file" data-file="' + f.id + '" data-type="' + esc(f.type) + '" title="' + esc(f.name) + '">' + (/^image\/(png|jpe?g|webp|gif)/.test(f.type) ? '<img data-img="' + f.id + '" alt="">' : '📄') + '<small>' + esc(f.name) + '</small></div>';
    }).join('');
    return '<div class="card" data-id="' + q.id + '"><div class="top"><div><div class="name">#' + q.id + ' ' + esc(q.organization || q.name) + '</div>' +
      '<div class="dim">' + esc(new Date(q.created).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })) + (q.organization ? ' &bull; ' + esc(q.name) : '') + '</div></div>' +
      '<div style="display:flex;gap:6px">' + (rush ? '<span class="pill rush">Rush</span>' : '') + '<span class="pill ' + (q.status === 'new' ? 'new' : '') + '">' + esc(q.status) + '</span></div></div>' +
      '<div class="contact"><a href="mailto:' + esc(q.email) + '?subject=' + encodeURIComponent('Your Cre8 Quote #' + q.id) + '">' + esc(q.email) + '</a>' + (q.phone ? '<a href="sms:' + esc(q.phone) + '">' + esc(q.phone) + '</a>' : '') + (d.contact_preference ? '<span class="dim">Prefers ' + esc(d.contact_preference) + '</span>' : '') + '</div>' +
      '<div class="idea">' + esc(d.idea) + '</div><div class="grid">' +
      field('Quantity', q.quantity) + field('Need by', need) + field('For', d.occasion) + field('Products', (d.products || []).join(', ')) + field('Method', d.method) +
      field('Garment', garment) + field('Color', d.garment_color) + field('Locations', (d.locations || []).join(', ')) + field('Sizes', sizes) +
      field('Design', d.design_status) + field('Budget', d.budget) + field('Delivery', d.delivery) + field('Heard via', d.referral) +
      field('Mockup', [d.mockup_color, d.mockup_garment].filter(Boolean).join(' ')) + field('Mockup front', d.mockup_front) + field('Mockup back', d.mockup_back) + field('Print finish', d.finish) + field('Their own item', d.own_item) + field('Engraving item', d.engrave_item) + field('Engraving text', d.engrave_text) + field('Engraving font', d.engrave_font) + field('Engraving placement', d.engrave_design) + '</div>' +
      (files ? '<div class="files">' + files + '</div>' : '<div class="dim" style="margin-top:10px">No files uploaded.</div>') +
      '<div class="edit"><select data-status>' + opts + '</select><textarea data-notes placeholder="Private notes: price quoted, proof sent, payment...">' + esc(q.notes) + '</textarea></div>' +
      '<div class="actions"><button data-save>Save</button><button class="ghost" data-del>Delete</button></div></div>';
  }
  function draw() {
    var all = DATA.quotes, term = $('#q').value.trim().toLowerCase();
    var open = function (q) { return q.status !== 'done' && q.status !== 'lost'; };
    $('#stats').innerHTML = '<div class="stat"><b>' + all.filter(function (q) { return q.status === 'new'; }).length + '</b>New</div>' +
      '<div class="stat"><b>' + all.filter(open).length + '</b>Open</div>' +
      '<div class="stat"><b>' + all.filter(function (q) { return q.status === 'done'; }).length + '</b>Done</div>' +
      '<div class="stat"><b>' + (DATA.storedBytes / 1048576).toFixed(0) + 'MB</b>Files stored</div>';
    var fin = all.filter(function (q) { return q.status === 'done' || q.status === 'lost'; });
    var finMB = fin.reduce(function (a, q) { return a + (q.files || []).reduce(function (b, x) { return b + x.size; }, 0); }, 0) / 1048576;
    $('#clearBox').innerHTML = fin.length
      ? '<div><b>' + fin.length + ' finished quote' + (fin.length === 1 ? '' : 's') + '</b> (done or lost) holding ' + finMB.toFixed(1) + 'MB of files.</div><button id="clearFinished">Delete All Finished</button>'
      : '<div class="dim">No finished quotes to clear. Mark a job <b>done</b> or <b>lost</b> and it shows up here for cleanup.</div>';
    var f = ['open', 'all'].concat(DATA.statuses);
    $('#filters').innerHTML = f.map(function (s) { return '<button class="chip' + (s === FILTER ? ' on' : '') + '" data-f="' + s + '">' + s + '</button>'; }).join('');
    var rows = all.filter(function (q) { return FILTER === 'all' ? true : FILTER === 'open' ? open(q) : q.status === FILTER; })
      .filter(function (q) { return !term || [q.name, q.email, q.organization].join(' ').toLowerCase().indexOf(term) > -1; });
    $('#list').innerHTML = rows.length ? rows.map(card).join('') : '<div class="empty">No quote requests here.</div>';
    document.querySelectorAll('[data-img]').forEach(function (img) {
      var id = img.getAttribute('data-img');
      if (urls[id]) { img.src = urls[id]; return; }
      api('/api/admin/cre8/file/' + id).then(function (r) { return r.blob(); }).then(function (b) { urls[id] = URL.createObjectURL(b); img.src = urls[id]; }).catch(function () {});
    });
  }
  function loadMsgs() {
    return api('/api/admin/cre8/messages').then(function (r) { return r.json(); }).then(function (d) {
      var list = d.messages || [];
      $('#msgs').innerHTML = list.length ? list.map(function (m) {
        return '<div class="card" data-msg="' + m.id + '"><div class="top"><div><div class="name">' + esc(m.name) + (m.topic ? ' <span class="pill">' + esc(m.topic) + '</span>' : '') + '</div>' +
          '<div class="dim">' + esc(new Date(m.created).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })) + '</div></div></div>' +
          '<div class="contact"><a href="mailto:' + esc(m.email) + '">' + esc(m.email) + '</a>' + (m.phone ? '<a href="sms:' + esc(m.phone) + '">' + esc(m.phone) + '</a>' : '') + (m.contact_preference ? '<span class="dim">Prefers ' + esc(m.contact_preference) + '</span>' : '') + '</div>' +
          '<div class="idea">' + esc(m.message) + '</div><div class="actions"><button class="ghost" data-delmsg="' + m.id + '">Delete</button></div></div>';
      }).join('') : '<div class="empty">No messages yet.</div>';
    }).catch(function () {});
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-delmsg]'); if (!b) return;
    if (!confirm('Delete this message?')) return;
    api('/api/admin/cre8/messages/' + b.dataset.delmsg, { method: 'DELETE' }).then(function () { flash('Deleted'); loadMsgs(); }).catch(function (er) { flash(er.message); });
  });
  function load() {
    if (!KEY) return;
    return api('/api/admin/cre8/quotes').then(function (r) { return r.json(); })
      .then(function (d) { loadMsgs(); DATA = d; try { sessionStorage.setItem('la_cre8_admin', KEY); } catch (e) {} $('#login').hidden = true; $('#app').hidden = false; draw(); })
      .catch(function (e) { flash(e.message); });
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-f],[data-save],[data-del],[data-file]'); if (!t) return;
    if (t.dataset.f) { FILTER = t.dataset.f; draw(); return; }
    var c = t.closest('.card'), id = c && c.dataset.id;
    if (t.hasAttribute('data-file')) {
      var fid = t.dataset.file;
      api('/api/admin/cre8/file/' + fid + '?dl=1').then(function (r) { return r.blob(); }).then(function (b) {
        var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = t.title || 'file'; document.body.appendChild(a); a.click(); a.remove();
      }).catch(function (er) { flash(er.message); });
      return;
    }
    if (t.hasAttribute('data-save')) {
      api('/api/admin/cre8/quotes/' + id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: c.querySelector('[data-status]').value, notes: c.querySelector('[data-notes]').value }) })
        .then(function () { flash('Saved'); load(); }).catch(function (er) { flash(er.message); });
    }
    if (t.hasAttribute('data-del')) {
      if (!confirm('Delete quote #' + id + ' and all its files? This cannot be undone.')) return;
      api('/api/admin/cre8/quotes/' + id, { method: 'DELETE' }).then(function () { flash('Deleted'); load(); }).catch(function (er) { flash(er.message); });
    }
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#clearFinished')) return;
    var n = DATA.quotes.filter(function (q) { return q.status === 'done' || q.status === 'lost'; }).length;
    if (!confirm('Delete ' + n + ' finished quote' + (n === 1 ? '' : 's') + ' and all their files? This cannot be undone.')) return;
    api('/api/admin/cre8/finished', { method: 'DELETE' }).then(function (r) { return r.json(); })
      .then(function (j) { flash('Deleted ' + j.deleted + ', freed ' + (j.freedBytes / 1048576).toFixed(1) + 'MB'); load(); })
      .catch(function (er) { flash(er.message); });
  });
  $('#q').addEventListener('input', function () { if (DATA) draw(); });
  $('#go').onclick = function () { KEY = $('#key').value.trim(); load(); };
  $('#key').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#go').click(); });
  $('#refresh').onclick = function () { load(); flash('Refreshed'); };
  try { var saved = sessionStorage.getItem('la_cre8_admin') || sessionStorage.getItem('la_admin_key'); if (saved) { KEY = saved; load(); } } catch (e) {}
})();
</script>
</body>
</html>
