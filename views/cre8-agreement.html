<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Client Access Authorization | Can't Wait to Cre8</title>
<link rel="icon" type="image/png" href="/cre8/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111014;--paper:#fbf8f3;--line:#e6e0d6;--muted:#6b6672;--hot:#ff3d7f;--sun:#ffb21e;--ok:#18a957;--grad:linear-gradient(90deg,#ff3d7f,#ffb21e)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;font-size:16px}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
header{background:var(--ink);color:#fff;padding:22px 0}
header .wrap{display:flex;align-items:center;gap:14px}
header img{height:52px;border-radius:10px;background:#fff}
header b{font-family:"Archivo Black",sans-serif;font-size:19px;display:block}
header span{color:#b9b4c0;font-size:13px}
.doc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;margin:28px auto;box-shadow:0 18px 40px rgba(17,16,20,.05)}
h1{font-family:"Archivo Black",sans-serif;font-size:clamp(26px,4.4vw,36px);line-height:1.15;letter-spacing:-.3px}
.meta{color:var(--muted);font-size:14px;margin:8px 0 24px}
.sec{margin-top:20px}
.sec h2{font-size:16px;font-weight:700;margin-bottom:4px}
.sec p{color:#2f2b35;font-size:15.5px}
.sec ul{margin:8px 0 0 22px;font-size:15.5px}
.sec li{margin:3px 0}
.sign{margin-top:30px;border-top:2px solid var(--ink);padding-top:22px}
.sign h2{font-family:"Archivo Black",sans-serif;font-size:20px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.doc{padding:22px}}
label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input[type=text],input[type=email]{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff}
input:focus{outline:none;border-color:var(--hot)}
.pad{position:relative;border:2px dashed #cfc8bd;border-radius:14px;background:#fffdf9;touch-action:none}
.pad canvas{display:block;width:100%;height:180px;cursor:crosshair}
.pad .hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#b8b0a3;pointer-events:none;font-size:15px}
.pad .base{position:absolute;left:24px;right:24px;bottom:38px;border-bottom:1px solid #d8d1c5;pointer-events:none}
.pad .x{position:absolute;left:18px;bottom:40px;color:#b8b0a3;font-size:18px;pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:13px 24px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
.btn-hot{background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(255,61,127,.25)}
.btn-ghost{background:#fff;border:2px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14.5px;cursor:pointer}
.consent input{margin-top:4px;width:18px;height:18px;flex:none}
.err{display:none;margin-top:12px;background:#fdecec;color:#a3262a;padding:12px 14px;border-radius:12px;font-weight:600}
.done{background:#e8f7ee;color:#0f6b38;border-radius:14px;padding:14px 16px;font-weight:600;margin-bottom:18px}
.sigimg{max-width:340px;width:100%;border-bottom:1px solid var(--ink);display:block;margin-top:6px}
.audit{margin-top:18px;font-size:13px;color:var(--muted);background:#faf7f2;border-radius:12px;padding:14px 16px;word-break:break-all}
.audit b{color:var(--ink)}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px}
@media(max-width:600px){.parties{grid-template-columns:1fr}}
.parties small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.typed{font-family:"Brush Script MT","Segoe Script",cursive;font-size:30px;line-height:1.2;border-bottom:1px solid var(--ink);padding:6px 0;margin-top:6px}
.missing{text-align:center;padding:80px 20px;color:var(--muted)}
@media print{header,.noprint,.btn{display:none!important}body{background:#fff}.doc{border:0;box-shadow:none;margin:0;padding:0}}
</style>
</head>
<body>
<header><div class="wrap"><img src="/cre8/logo.png" alt="Can't Wait to Cre8"><div><b>Can't Wait to Cre8</b><span>37 Center Ave, Leonardo, NJ 07737 &bull; 732-720-9211</span></div></div></header>
<main class="wrap"><div class="doc" id="doc"><p class="missing">Loading the agreement...</p></div></main>
<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var m = location.pathname.match(/\/agreement\/(\d+)\/([a-f0-9]{32})/), API = m ? '/api/cre8/agreements/' + m[1] + '/' + m[2] : '';
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
  function when(d){ return new Date(d).toLocaleString('en-US', { timeZone: 'America/New_York', dateStyle: 'long', timeStyle: 'short' }) + ' Eastern'; }
  function load(){
    if(!API){ $('#doc').innerHTML = '<p class="missing">This agreement link is not complete. Ask Can\'t Wait to Cre8 for a new one.</p>'; return; }
    fetch(API, { cache: 'no-store' }).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.message || 'Not found'); return j; }); }).then(render)
      .catch(function(e){ $('#doc').innerHTML = '<p class="missing">' + esc(e.message) + '</p>'; });
  }
  function render(a){
    var who = a.business || a.client_name, s = a.signed;
    var html = (s ? '<div class="done noprint">Signed by ' + esc(s.name) + ' on ' + esc(when(s.at)) + '. A copy was emailed to both parties.</div>' : '') +
      '<h1>Client Access Authorization</h1><div class="meta">Can\'t Wait to Cre8 and ' + esc(who) + ' &bull; Version ' + esc(a.version) + ' &bull; Prepared ' + esc(new Date(a.created).toLocaleDateString('en-US', { dateStyle: 'long' })) + '</div>' +
      a.sections.map(function(x){ return '<div class="sec"><h2>' + esc(x.title) + '</h2><p>' + esc(x.text) + '</p>' + (x.list ? '<ul>' + x.list.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>' : '') + '</div>'; }).join('');
    if(s){
      html += '<div class="sign"><h2>Signatures</h2><div class="parties">' +
        '<div><small>Client</small><img class="sigimg" src="' + esc(s.signature) + '" alt="Client signature"><div style="margin-top:6px"><b>' + esc(s.name) + '</b>' + (s.title ? ', ' + esc(s.title) : '') + '<br>' + esc(who) + '<br><span style="color:var(--muted);font-size:14px">' + esc(when(s.at)) + '</span></div></div>' +
        '<div><small>Can\'t Wait to Cre8</small><div class="typed">Keith Simmonds Jr.</div><div style="margin-top:6px"><b>Keith Simmonds Jr.</b>, Owner<br>Can\'t Wait to Cre8<br><span style="color:var(--muted);font-size:14px">Offered ' + esc(new Date(a.created).toLocaleDateString('en-US', { dateStyle: 'long' })) + '</span></div></div></div>' +
        '<div class="audit"><b>Signature record</b><br>Signed electronically ' + esc(when(s.at)) + (s.email ? ' &bull; ' + esc(s.email) : '') + ' &bull; IP ' + esc(s.ip || 'not recorded') + '<br>Document fingerprint (SHA-256): ' + esc(s.hash) + '</div>' +
        '<div class="row noprint" style="margin-top:18px"><button class="btn btn-hot" type="button" onclick="window.print()">Print or Save as PDF</button></div></div>';
    } else {
      html += '<div class="sign noprint" id="signBox"><h2>Sign this agreement</h2><p style="color:var(--muted);font-size:15px">Read the agreement above, then draw your signature and type your name.</p>' +
        '<div class="grid"><div><label class="f" for="nm">Full legal name *</label><input type="text" id="nm" autocomplete="name" value="' + esc(a.client_name) + '"></div>' +
        '<div><label class="f" for="tt">Title</label><input type="text" id="tt" placeholder="Owner, Manager..." autocomplete="organization-title"></div></div>' +
        '<label class="f" for="em">Email for your signed copy</label><input type="email" id="em" autocomplete="email" value="' + esc(a.email) + '">' +
        '<label class="f">Signature *</label><div class="pad" id="pad"><canvas id="cv" aria-label="Signature pad: draw your signature"></canvas><span class="x">&times;</span><span class="base"></span><span class="hint" id="hint">Sign here with your finger or mouse</span></div>' +
        '<div class="row"><span style="color:var(--muted);font-size:13px">Signing for ' + esc(who) + '</span><button class="btn btn-ghost" type="button" id="clr" style="padding:8px 16px;font-size:14px">Clear</button></div>' +
        '<label class="consent"><input type="checkbox" id="ok"><span>I have read this Client Access Authorization, I am authorized to sign it for ' + esc(who) + ', and I agree that my electronic signature is the legal equivalent of my handwritten signature.</span></label>' +
        '<button class="btn btn-hot" type="button" id="go" style="margin-top:18px;width:100%">Sign Agreement</button><div class="err" id="err"></div></div>';
    }
    $('#doc').innerHTML = html;
    if(!s) pad();
  }
  function pad(){
    var cv = $('#cv'), ctx = cv.getContext('2d'), drawing = false, strokes = 0, last = null;
    function size(){ var r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1, img = strokes ? cv.toDataURL() : null; cv.width = r.width * d; cv.height = r.height * d; ctx.scale(d, d); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111014';
      if(img){ var i = new Image(); i.onload = function(){ ctx.drawImage(i, 0, 0, r.width, r.height); }; i.src = img; } }
    size(); window.addEventListener('resize', size);
    function pt(e){ var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    cv.addEventListener('pointerdown', function(e){ e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true; last = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(last.x + .1, last.y + .1); ctx.stroke(); $('#hint').style.display = 'none'; });
    cv.addEventListener('pointermove', function(e){ if(!drawing) return; e.preventDefault(); var p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; strokes++; });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function(ev){ cv.addEventListener(ev, function(){ drawing = false; }); });
    $('#clr').onclick = function(){ ctx.clearRect(0, 0, cv.width, cv.height); strokes = 0; $('#hint').style.display = ''; };
    $('#go').onclick = function(){
      var err = $('#err'); err.style.display = 'none';
      var fail = function(t, el){ err.textContent = t; err.style.display = 'block'; if(el) el.focus(); };
      if($('#nm').value.trim().length < 3) return fail('Type your full legal name.', $('#nm'));
      if(strokes < 8) return fail('Draw your signature in the box.');
      if(!$('#ok').checked) return fail('Check the box to confirm you agree and are signing electronically.', $('#ok'));
      // Export the signature on white at a modest size so it prints cleanly
      var r = cv.getBoundingClientRect(), out = document.createElement('canvas'); out.width = 700; out.height = Math.round(700 * r.height / r.width);
      var o = out.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height); o.drawImage(cv, 0, 0, out.width, out.height);
      var btn = $('#go'); btn.disabled = true; btn.textContent = 'Signing...';
      fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('#nm').value, title: $('#tt').value, email: $('#em').value, signature: out.toDataURL('image/png'), consent: true }) })
        .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.message || 'Could not sign right now.'); return j; }); })
        .then(function(){ load(); window.scrollTo(0, 0); })
        .catch(function(e){ fail(e.message); btn.disabled = false; btn.textContent = 'Sign Agreement'; });
    };
  }
  load();
})();
</script>
</body>
</html>
